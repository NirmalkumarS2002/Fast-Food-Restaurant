<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly - Page Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,-50..200" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "DM Sans", sans-serif;
        }

        :root {
            --yellow: #FFCC33;
            --dark: #191919;
            --cream: #fffaf5;
            --paper: #fffdf8;
            --tomato: #e6483a;
            --line: rgba(25, 25, 25, 0.14);
        }

        html,
        body {
            overflow-x: hidden;
        }

        body {
            background: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        h1 {
            font-family: "Poppins", sans-serif;
        }

        /* giant outline wordmark behind everything */
        .wordmark {
            position: absolute;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%) rotate(-4deg);
            font-family: "Poppins", sans-serif;
            font-weight: 800;
            font-size: clamp(140px, 26vw, 320px);
            line-height: 0.86;
            letter-spacing: -4px;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.08);
            z-index: 0;
            white-space: nowrap;
            pointer-events: none;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px clamp(20px, 5vw, 60px);
            position: relative;
            z-index: 2;
        }

        .logo img {
            width: 140px;
        }

        .back-home {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 13.5px;
            opacity: 0.75;
            transition: opacity .25s ease;
        }

        .back-home:hover {
            opacity: 1;
        }

        .body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 60px;
            position: relative;
            z-index: 2;
        }

        /* the "voided order ticket" card */
        .ticket {
            width: 100%;
            max-width: 420px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 4px;
            position: relative;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .ticket::before,
        .ticket::after {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            background: var(--dark);
            border-radius: 50%;
            top: 150px;
        }

        .ticket::before {
            left: -11px;
        }

        .ticket::after {
            right: -11px;
        }

        .ticket-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 26px 30px 18px;
            text-align: left;
        }

        .ticket-head .num {
            font-size: 11.5px;
            color: #948a77;
            letter-spacing: 0.5px;
        }

        .ticket-head .num b {
            display: block;
            color: var(--dark);
            font-size: 15px;
        }

        .stamp {
            border: 2px solid var(--tomato);
            color: var(--tomato);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 12px;
            border-radius: 4px;
            transform: rotate(-6deg);
        }

        .perf {
            border-top: 1.5px dashed var(--line);
        }

        .ticket-body {
            padding: 8px 34px 34px;
        }

        .code {
            font-family: "Poppins", sans-serif;
            font-weight: 800;
            font-size: 76px;
            color: var(--dark);
            line-height: 1;
            margin: 14px 0 4px;
        }

        .code span {
            color: var(--yellow);
            -webkit-text-stroke: 2px var(--dark);
        }

        .ticket-body h1 {
            font-size: 21px;
            color: var(--dark);
            margin: 6px 0 10px;
        }

        .ticket-body p {
            color: #74695a;
            font-size: 14px;
            line-height: 1.6;
            max-width: 300px;
            margin: 0 auto 26px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px;
            background: var(--dark);
            color: var(--yellow);
            border: none;
            border-radius: 30px;
            font-size: 14.5px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background .25s ease, transform .25s ease;
        }

        .btn-primary:hover {
            background: #000;
            transform: translateY(-2px);
        }

        .btn-primary span {
            transition: transform .25s ease;
        }

        .btn-primary:hover span {
            transform: translateX(4px);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            background: transparent;
            color: var(--dark);
            border: 1.5px solid var(--line);
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: .25s ease;
            cursor: pointer;
        }

        .btn-secondary:hover {
            border-color: var(--yellow);
            background: #fff6df;
        }


        .btn-secondary span {
            transition: transform .25s ease;
        }

        .btn-secondary:hover span {
            transform: translateX(-4px);
        }

        .foot-note {
            position: relative;
            z-index: 2;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            padding-bottom: 30px;
        }

        @media (max-width: 480px) {

            .ticket-head,
            .ticket-body {
                padding-left: 24px;
                padding-right: 24px;
            }

            .code {
                font-size: 58px;
            }
        }
    </style>
</head>

<body>

    <div class="wordmark">STACKLY</div>

    <div class="top">
        <a href="index.html" class="logo">
            <img src="./src/logo.webp" alt="Stackly logo">
        </a>
        <a href="index.html" class="back-home"><span class="material-symbols-outlined">arrow_back</span>Back to Home</a>
    </div>

    <div class="body">
        <div class="ticket">

            <div class="ticket-head">
                <div class="num">TICKET NO.<b>#0404</b></div>
                <div class="stamp">VOID</div>
            </div>

            <div class="perf"></div>

            <div class="ticket-body">
                <div class="code">4<span>0</span>4</div>
                <h1>This one's off the menu</h1>
                <p>The page you ordered isn't on today's menu. It may have moved, sold out, or never existed.</p>

                <div class="actions">
                    <a href="index.html" class="btn-primary">Back to Home<span
                            class="material-symbols-outlined">arrow_right_alt</span></a>
                    <div class="btn-secondary goback"><span class="material-symbols-outlined">arrow_left_alt</span>Go
                        Back</div>
                </div>
            </div>
        </div>
    </div>

    <p class="foot-note">@2026 Stackly. All Rights Reserved</p>

    <script>
        let goback = document.querySelector(".goback")
        goback.addEventListener("click", () => {

            window.history.back()

        })
    </script>

</body>

</html>
